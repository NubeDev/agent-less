services:
  # ── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: diraigent
      POSTGRES_USER: diraigent
      POSTGRES_PASSWORD: diraigent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diraigent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Diraigent ─────────────────────────────────────────────────────

  api:
    image: diraigent/api:latest
    networks:
      default:
        aliases:
          - diraigent-api
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://diraigent:diraigent@postgres:5432/diraigent
      DEV_USER_ID: ${DEV_USER_ID:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      SERVICE_NAME: diraigent-api
      LOKI_URL: ${LOKI_URL:-}
      LOKI_ENV: ${LOKI_ENV:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      PROJECTS_PATH: /projects
    volumes:
      - ${PROJECTS_PATH:-~/diraigent/projects}:/projects
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: diraigent/web:latest
    ports:
      - "4200:80"
    environment:
      API_SERVER: ${API_SERVER:-http://localhost:3000/v1}
      AUTH_PROVIDER_BASE: ${AUTH_PROVIDER_BASE:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy

  orchestra:
    image: diraigent/orchestra:latest
    environment:
      AGENT_ID: ${AGENT_ID:-}
      DIRAIGENT_API_URL: http://api:3000/v1
      DIRAIGENT_API_TOKEN: ${DIRAIGENT_API_TOKEN:-}
      DIRAIGENT_DEV_USER_ID: ${DEV_USER_ID:-}
      MAX_WORKERS: ${MAX_WORKERS:-3}
      PROJECTS_PATH: /projects
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ${PROJECTS_PATH:-~/diraigent/projects}:/projects
    depends_on:
      api:
        condition: service_healthy

  # ── Forgejo (Git + CI) ──────────────────────────────────────────────

  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__server__ROOT_URL: http://localhost:3030/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      # Allow webhooks to call back to the host on the docker bridge IP.
      # Required for /v1/webhooks/forgejo/{id} delivery from the container.
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "3030:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:6.2.1
    depends_on:
      - forgejo
    environment:
      FORGEJO_SECRET: ${FORGEJO_RUNNER_SECRET:-}
    entrypoint: >
      sh -c "forgejo-runner create-runner-file --connect
      --instance http://forgejo:3000
      --secret $$FORGEJO_SECRET
      --name local-runner &&
      forgejo-runner daemon --config /etc/forgejo-runner/config.yaml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./forgejo-runner-config.yaml:/etc/forgejo-runner/config.yaml:ro

volumes:
  pgdata:
  forgejo-data:
